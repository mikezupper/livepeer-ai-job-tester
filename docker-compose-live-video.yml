services:

  ai-job-tester:
    image: ai-job-tester:latest
    container_name: "ai-job-tester"
    restart: unless-stopped
    volumes:
      - ai-job-tester:/app/configs
    environment:
      - TZ=UTC
      - CRONTAB_SCHEDULE=0 */2 * * *
      - CONFIG_FILE=/app/configs/config.json
    depends_on:
      - tester-gateway
      - service-registry-gateway

  tester-gateway:
    image: tztcloud/go-livepeer:v0.8.6
    restart: unless-stopped
    hostname: ai-tester-gateway
    container_name: ai-tester-gateway
    environment:
      - LIVEPEER_OS_HTTP_TIMEOUT=8s
    volumes:
      - tester-gateway-lpData:/root/.lpData
    command: '-ethUrl=YOUR_RPC_URL
              -ethPassword=/root/.lpData/eth-secret.txt
              -ethKeystorePath=/root/.lpData
              -network=arbitrum-one-mainnet
              -serviceAddr=ai-tester-gateway:8935
              -cliAddr=ai-tester-gateway:7935
              -gateway=true
              -monitor=true
              -maxPricePerUnit=125000000
              -maxTotalEV=100000000000000
              -v=6
              -pixelsPerUnit=1
              -blockPollingInterval=20
              -httpIngest=true
              -httpAddr=0.0.0.0:8935
              -rtmpAddr=0.0.0.0:1936
              -orchMinLivepeerVersion=v0.7.9-ai.3
              -discoveryTimeout=750ms
              -webhookRefreshInterval=0
              -aiSessionTimeout=0
              -orchWebhookUrl=http://ai-job-tester:7934/orchestrators
              '

  service-registry-gateway:
    image: tztcloud/go-livepeer:v0.8.6
    restart: unless-stopped
    hostname: service-registry-gateway
    container_name: service-registry-gateway
    environment:
      - LIVEPEER_OS_HTTP_TIMEOUT=8s
    volumes:
      - service-registry-gateway-lpData:/root/.lpData
    command: '-ethUrl=https://arb1.xode.app/l2/def1e30d5e9ef490f82c7d8a7af6d912
              -ethPassword=/root/.lpData/eth-secret.txt
              -ethKeystorePath=/root/.lpData
              -network=arbitrum-one-mainnet
              -serviceAddr=service-registry-gateway:8935
              -cliAddr=service-registry-gateway:7935
              -gateway=true
              -monitor=true
              -maxPricePerUnit=125000000
              -maxTotalEV=100000000000000
              -v=6
              -pixelsPerUnit=1
              -blockPollingInterval=20
              -httpIngest=true
              -httpAddr=0.0.0.0:8935
              -rtmpAddr=0.0.0.0:1936
              -orchMinLivepeerVersion=v0.7.9-ai.3
              -discoveryTimeout=750ms
              -webhookRefreshInterval=0
              -aiSessionTimeout=0
              -orchAddr=https://stream2.speedybird.xyz:18937,https://stream.speedybird.xyz:18936
              '

  mediamtx:
    image: livepeerci/mediamtx
    container_name: live-video-to-video-mediamtx
    # ports:
    # DO NOT EXPOSE PORTS TO THE INTERNET UNLESS YOU KNOW WHAT YOU ARE DOING/ENABLE AUTH
    #   - "1935:1935"   # RTMP
    #   - "8888:8888"   # HLS
    #   - "9999:9999"   # API
    volumes:
      - ./configs/mediamtx/mediamtx.yml:/mediamtx.yml
      # Add the below path mount if you want to save recordings to host
      # also enable the recording settings in mediamtx.yml for the relevant paths
      # - ./mediamtx-recordings:/app/recordings 

volumes:
  tester-gateway-lpData:
    external: true
  service-registry-gateway-lpData:
    external: true
  ai-job-tester:
    external: true