# Single compose file for all run modes. Use profiles to select the stack.
#
# Usage:
#   docker compose --profile batch        up -d              # AI batch pipelines (cron every 2 min)
#   docker compose --profile live         up -d              # live video-to-video (cron every 2 h)
#   docker compose --profile live-network up -d              # live video-to-video, test individual orchestrators
#   RUN_IMMEDIATE=true docker compose --profile live up      # live video-to-video, run once immediately
#
# Profiles are mutually exclusive. Do not combine them in the same invocation.

services:

  # ---------------------------------------------------------------------------
  # AI batch pipeline testing — production
  # ---------------------------------------------------------------------------
  ai-job-tester-batch:
    profiles: [ batch ]
    image: tztcloud/ai-job-tester:latest
    container_name: ai-job-tester-batch
    restart: unless-stopped
    volumes:
      - ./configs/ai-job-tester/:/app/configs
      #PROD
      #- /opt/ai-job-tester/configs:/app/configs:ro-
    environment:
      - TZ=UTC
      #Dev
      - CRONTAB_SCHEDULE=*/5 * * * *
      #MDW
      #- CRONTAB_SCHEDULE=0 2,10,18 * * *
      #FRA
      #- CRONTAB_SCHEDULE=0 1,9,17 * * *
      #SEA
      #- CRONTAB_SCHEDULE=0 0,8,16 * * *
      - CONFIG_FILE=/app/configs/config-ai-batch-pipelines.json
      - RUN_IMMEDIATE=${RUN_IMMEDIATE:-false}
    depends_on:
      - tester-gateway-batch

  tester-gateway-batch:
    profiles: [ batch ]
    image: tztcloud/go-livepeer:latest
    restart: unless-stopped
    hostname: ai-tester-gateway-batch
    container_name: ai-tester-gateway-batch
    environment:
      - LIVEPEER_OS_HTTP_TIMEOUT=8s
      - LIVEPEER_TESTER_GATEWAY_ENABLED=true
    volumes:
      - ./configs/gateway:/root/.lpData
      #PROD
      #- /opt/ai-job-tester/gateway:/root/.lpData
    command: '-ethUrl=YOUR_ARB_RPC_URL
              -ethPassword=/root/.lpData/eth-secret.txt
              -ethKeystorePath=/root/.lpData
              -datadir=/root/.lpData/batch
              -network=arbitrum-one-mainnet
              -serviceAddr=ai-tester-gateway-batch:8935
              -cliAddr=ai-tester-gateway-batch:7935
              -gateway=true
              -monitor=true
              -maxPricePerUnit=125000000
              -maxTotalEV=100000000000000
              -v=4
              -pixelsPerUnit=1
              -blockPollingInterval=20
              -httpIngest=true
              -httpAddr=0.0.0.0:8935
              -discoveryTimeout=1000ms
              -orchMinLivepeerVersion=v0.7.9
              -aiServiceRegistry=true
              '

  # ---------------------------------------------------------------------------
  # Live video-to-video pipeline testing — production
  # ---------------------------------------------------------------------------
  ai-job-tester-live:
    profiles: [ live ]
    image: tztcloud/ai-job-tester:latest
    container_name: ai-job-tester-live
    restart: unless-stopped
    volumes:
      - ./configs/ai-job-tester:/app/configs:ro
    #PROD
    #- /opt/ai-job-tester/configs:/app/configs:ro
    environment:
      - TZ=UTC
      #MDW
      #- CRONTAB_SCHEDULE=20 * * * *
      #FRA
      #- CRONTAB_SCHEDULE=40 * * * *
      #SEA
      #- CRONTAB_SCHEDULE=0 * * * *
      - CRONTAB_SCHEDULE=*/10 * * * *
      - CONFIG_FILE=/app/configs/config-live-video-to-video-pipelines.json
      - RUN_IMMEDIATE=${RUN_IMMEDIATE:-false}
    depends_on:
      tester-gateway-live:
        condition: service_started
      mediamtx:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Live video-to-video gateway — shared by production (live) and local dev
