  # ---------------------------------------------------------------------------
  # Live video-to-video pipeline testing — network mode (tests individual orchestrators)
  # ---------------------------------------------------------------------------
  ai-job-tester-live-network:
    profiles: [ live-network ]
    image: tztcloud/ai-job-tester:latest
    container_name: ai-job-tester-live-network
    restart: unless-stopped
    volumes:
      - ./configs/ai-job-tester:/app/configs:ro
    #PROD
    #- /opt/ai-job-tester/configs:/app/configs:ro
    environment:
      - TZ=UTC
      - CRONTAB_SCHEDULE=50 * * * *
      - CONFIG_FILE=/app/configs/config-live-video-to-video-pipelines.json
      - RUN_IMMEDIATE=${RUN_IMMEDIATE:-false}
      - TEST_INDIVIDUAL_ORCHESTRATORS=false
    depends_on:
      tester-gateway-live-network:
        condition: service_started
      mediamtx:
        condition: service_started

