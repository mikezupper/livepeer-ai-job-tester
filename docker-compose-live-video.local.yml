services:
  ai-job-tester:
    # Local-only override for one-shot manual runs. Production should keep using
    # docker-compose-live-video.yml by itself so the cron entrypoint stays intact.
    image: ai-job-tester:local
    build:
      context: .
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        attempt=1
        exit_code=1
        while [ "$$attempt" -le "$$LOCAL_STARTUP_RETRIES" ]; do
          echo "starting local jobtester attempt $$attempt/$$LOCAL_STARTUP_RETRIES"
          /app/jobtester -f "$$CONFIG_FILE" -liveManualAttachSeconds "$$LIVE_MANUAL_ATTACH_SECONDS"
          exit_code=$$?
          if [ "$$exit_code" -eq 0 ]; then
            break
          fi
          if [ "$$attempt" -lt "$$LOCAL_STARTUP_RETRIES" ]; then
            echo "jobtester attempt $$attempt failed with code $$exit_code. Retrying in $$LOCAL_STARTUP_RETRY_DELAY_SECONDS seconds."
            sleep "$$LOCAL_STARTUP_RETRY_DELAY_SECONDS"
          fi
          attempt=$$((attempt + 1))
        done
        echo "jobtester exited with code $$exit_code. Sleeping $$POST_RUN_SLEEP_SECONDS seconds for manual inspection."
        sleep "$$POST_RUN_SLEEP_SECONDS"
        exit "$$exit_code"
    environment:
      - TZ=UTC
      - CONFIG_FILE=${CONFIG_FILE:-/app/local-configs/config-live-video-to-video-pipelines.json}
      - LIVE_MANUAL_ATTACH_SECONDS=${LIVE_MANUAL_ATTACH_SECONDS:-20}
      - LOCAL_STARTUP_RETRIES=${LOCAL_STARTUP_RETRIES:-4}
      - LOCAL_STARTUP_RETRY_DELAY_SECONDS=${LOCAL_STARTUP_RETRY_DELAY_SECONDS:-10}
      - POST_RUN_SLEEP_SECONDS=${POST_RUN_SLEEP_SECONDS:-600}
    volumes:
      - ./configs:/app/local-configs:ro
